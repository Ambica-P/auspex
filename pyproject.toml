[project]
name = "auspex"
version = "0.2.1"
description = "Precedence-aware coordination above Open-RMF for hospital transport."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=1.40",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "tavily-python>=0.5",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auspex"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL", "N"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0917", "PLR2004", "S101", "N818"]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["N999"]
"rmf_adapter_ext/check_*.py" = ["PLR0915"]
"src/auspex/monitor/progress.py" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "."]
packages = ["auspex", "hospital_mock", "sandbox"]

[[tool.mypy.overrides]]
module = ["alembic.*", "tavily", "tavily.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
